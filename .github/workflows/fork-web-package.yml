name: Fork web package

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fork-web-package.yml'
      - 'scripts/fork-web/**'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the upstream, patches and tools are unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-web-package
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'ykai55/openchamber'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_DIR: ${{ github.workspace }}/source
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openchamber/openchamber
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check release tooling
        run: node --test control/scripts/fork-web/*.test.mjs

      - name: Check publishing permission is configured
        env:
          HAS_PUBLISH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN != '' }}
        run: test "$HAS_PUBLISH_TOKEN" = true || { echo 'Set FORK_PUSH_TOKEN with Contents and Workflows write access to this fork.'; exit 1; }

      - name: Prepare upstream and pending patches
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: node control/scripts/fork-web/prepare.mjs

      - name: Read the upstream Bun pin
        if: steps.prepare.outputs.build == 'true'
        id: bun
        run: echo "version=$(node -p "require('./source/package.json').packageManager.split('@')[1]")" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.prepare.outputs.build == 'true'
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install upstream dependencies
        if: steps.prepare.outputs.build == 'true'
        working-directory: source
        run: bun install --frozen-lockfile

      - name: Stamp fork version and manual-update policy
        if: steps.prepare.outputs.build == 'true'
        run: node control/scripts/fork-web/package.mjs stamp

      - name: Build web and SDK
        if: steps.prepare.outputs.build == 'true'
        working-directory: source
        run: |
          bun run --cwd packages/sdk build
          bun run build:web

      - name: Pack and verify the installable release
        if: steps.prepare.outputs.build == 'true'
        run: |
          node control/scripts/fork-web/package.mjs
          npm install --global --prefix "$RUNNER_TEMP/fork-smoke" --allow-scripts=node-pty --no-audit --no-fund "$ARTIFACT_DIR/openchamber-web.tgz"
          "$RUNNER_TEMP/fork-smoke/bin/openchamber" --version
          node --input-type=module -e "const m=await import(process.env.RUNNER_TEMP+'/fork-smoke/lib/node_modules/@openchamber/web/server/lib/package-manager.js'); if(!m.isUnmanagedInstall())process.exit(1)"
          node -e "const p=require(process.env.RUNNER_TEMP+'/fork-smoke/lib/node_modules/@openchamber/web/package.json'); const s=require(process.env.RUNNER_TEMP+'/fork-smoke/lib/node_modules/@openchamber/web/node_modules/@openchamber/sdk/package.json'); if(p.version!==s.version||!p.openchamberFork)process.exit(1)"
          node -e "require(process.env.RUNNER_TEMP+'/fork-smoke/lib/node_modules/@openchamber/web/node_modules/node-pty')"
          npm_config_prefix="$RUNNER_TEMP/fork-smoke" node --import ./control/scripts/fork-web/smoke-update.mjs "$RUNNER_TEMP/fork-smoke/bin/openchamber" update --json > "$RUNNER_TEMP/fork-update.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/fork-update.json'); const p=require(process.env.ARTIFACT_DIR+'/plan.json'); if(r.updated!==false||r.currentVersion!==p.version||r.latestVersion!==p.version)process.exit(1)"

      - name: Publish the tested branch and release
        if: steps.prepare.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node control/scripts/fork-web/publish.mjs

      - name: Keep build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-web-plan-${{ github.run_number }}
          path: artifacts/plan.json
          if-no-files-found: ignore
